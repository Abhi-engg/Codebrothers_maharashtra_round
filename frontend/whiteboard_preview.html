<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re:Learn — Vector Whiteboard Interactive Preview</title>
  <style>
    :root {
      --bg: #F7FAFC;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --primary: #3182CE;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      color: #1A202C;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 12px;
      background: #EBF8FF;
      color: #2B6CB0;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    button, select {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #EDF2F7; }
    button.primary {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }
    button.primary:hover { background: #2B6CB0; }
    .status-bar {
      margin-top: 10px;
      font-size: 14px;
      color: #4A5568;
      background: #EDF2F7;
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }
    canvas {
      width: 100%;
      height: 480px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: block;
    }
    .explanation-box {
      margin-top: 16px;
      line-height: 1.6;
      font-size: 14px;
    }
    .explanation-title {
      font-weight: 700;
      margin-bottom: 6px;
      color: #2B6CB0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Re:Learn Whiteboard Engine <span class="badge">Safe Vector Canvas</span></h1>
      <p style="color: #718096; margin-top: 4px; font-size: 14px;">
        Renders structured JSON tool commands from the backend with normalized [0.0, 1.0] coordinates.
      </p>
    </header>

    <div class="card">
      <div class="controls">
        <label for="preset-select" style="font-weight: 600; font-size: 14px;">Physics Preset:</label>
        <select id="preset-select">
          <option value="optics">Concave Mirror Sign Trap (MISC-G10-OPT-01)</option>
          <option value="circuits">Parallel Resistance & Current Split (MISC-G10-ELE-03)</option>
        </select>

        <button id="btn-play" class="primary">▶ Play</button>
        <button id="btn-pause">⏸ Pause</button>
        <button id="btn-prev">⏮ Step Back</button>
        <button id="btn-next">⏭ Next Step</button>
        <button id="btn-reset">↺ Reset</button>
      </div>

      <canvas id="whiteboard-canvas"></canvas>

      <div class="status-bar">
        <span id="step-indicator">Step 0 of 0</span>
        <span id="step-description">Ready</span>
      </div>

      <div class="explanation-box">
        <div id="concept-title" class="explanation-title">Concept Remediation</div>
        <p id="concept-desc">Loading pedagogical explanation...</p>
      </div>
    </div>
  </div>

  <script src="js/whiteboard.js"></script>
  <script>
    // Embedded sample payloads matching backend/intervention/whiteboard_schema.py
    const PRESETS = {
      optics: {
        misconception_id: "MISC-G10-OPT-01",
        concept_title: "Cartesian Sign Convention for Spherical Mirrors",
        pedagogical_explanation: "In optical ray tracing, the pole P serves as the origin (0, 0). Light travels from left to right. Any distance measured from P against incident light (to the left) is NEGATIVE. Because a concave mirror's focus lies in front of the mirror, f is ALWAYS negative (f = -15 cm).",
        commands: [
          { tool: "draw_axes", params: { origin: [0.50, 0.50], scale: "cartesian", color: "#718096" }, step_description: "Establish Principal Axis & Cartesian Reference Frame" },
          { tool: "draw_shape", params: { shape_type: "concave_mirror", x: 0.50, y: 0.20, height: 0.60, color: "#2B6CB0" }, step_description: "Draw Concave Mirror at origin" },
          { tool: "draw_text", params: { x: 0.52, y: 0.53, text: "Pole (P)", size: 13, color: "#2D3748" }, step_description: "Mark Pole" },
          { tool: "draw_arrow", params: { start: [0.50, 0.50], end: [0.25, 0.50], label: "f = -15 cm", color: "#E53E3E" }, step_description: "Highlight Focal Length (Negative Sign Convention)" },
          { tool: "draw_text", params: { x: 0.25, y: 0.47, text: "Focus (F)", size: 14, color: "#E53E3E" }, step_description: "Mark Focus Point" },
          { tool: "draw_arrow", params: { start: [0.15, 0.50], end: [0.15, 0.32], label: "Object (h=4cm)", color: "#38A169" }, step_description: "Place Object at u = -20 cm" },
          { tool: "draw_line", params: { start: [0.15, 0.32], end: [0.50, 0.32], style: "solid", color: "#D69E2E" }, step_description: "Ray 1: Parallel to Principal Axis" },
          { tool: "draw_line", params: { start: [0.50, 0.32], end: [0.05, 0.68], style: "solid", color: "#D69E2E" }, step_description: "Ray 1 Reflects Through Focus F" },
          { tool: "highlight_region", params: { bounds: [0.20, 0.40, 0.30, 0.60], color: "#ECC94B", pulse: true }, step_description: "Identify Sign Trap: Always substitute negative f and negative u!" }
        ]
      },
      circuits: {
        misconception_id: "MISC-G10-ELE-03",
        concept_title: "Parallel Circuits: Current Splitting and Reciprocal Inversion",
        pedagogical_explanation: "In parallel connections, voltage across both branches is identical (12V). Current splits inversely proportional to resistance. To find equivalent resistance, sum reciprocals (1/Rp = 1/6 + 1/12 = 3/12 = 1/4) and ALWAYS invert to get Rp = 4 ohms.",
        commands: [
          { tool: "draw_shape", params: { shape_type: "battery", x: 0.15, y: 0.50, width: 0.08, height: 0.15, color: "#C53030" }, step_description: "Place 12V Battery Source" },
          { tool: "draw_line", params: { start: [0.15, 0.42], end: [0.35, 0.42], style: "solid", color: "#2D3748" }, step_description: "Lead Wire to Junction" },
          { tool: "draw_arrow", params: { start: [0.20, 0.38], end: [0.30, 0.38], label: "Total I = 3A", color: "#3182CE" }, step_description: "Main Branch Current Flow" },
          { tool: "draw_shape", params: { shape_type: "resistor", x: 0.55, y: 0.30, width: 0.18, height: 0.08, color: "#D69E2E" }, step_description: "Top Branch Resistor R1 = 6Ω" },
          { tool: "draw_shape", params: { shape_type: "resistor", x: 0.55, y: 0.60, width: 0.18, height: 0.08, color: "#38A169" }, step_description: "Bottom Branch Resistor R2 = 12Ω" },
          { tool: "draw_text", params: { x: 0.55, y: 0.22, text: "I1 = 12V / 6Ω = 2A", size: 13, color: "#D69E2E" }, step_description: "Calculate Top Branch Current" },
          { tool: "draw_text", params: { x: 0.55, y: 0.72, text: "I2 = 12V / 12Ω = 1A", size: 13, color: "#38A169" }, step_description: "Calculate Bottom Branch Current" },
          { tool: "highlight_region", params: { bounds: [0.45, 0.20, 0.75, 0.75], color: "#ECC94B", pulse: true }, step_description: "Reciprocal Summing: 1/Rp = 1/6 + 1/12 = 3/12 => Rp = 4Ω" }
        ]
      }
    };

    const whiteboard = new ReLearnWhiteboard('whiteboard-canvas', {
      playbackSpeedMs: 1000,
      onStepChange: (step, total) => {
        document.getElementById('step-indicator').textContent = `Step ${step} of ${total}`;
        const activeCmd = whiteboard.payload && whiteboard.payload.commands[step - 1];
        document.getElementById('step-description').textContent = activeCmd ? activeCmd.step_description : (step === 0 ? "Ready" : "Complete");
      }
    });

    function loadPreset(key) {
      const data = PRESETS[key];
      document.getElementById('concept-title').textContent = data.concept_title;
      document.getElementById('concept-desc').textContent = data.pedagogical_explanation;
      whiteboard.loadPayload(data);
    }

    document.getElementById('preset-select').addEventListener('change', (e) => loadPreset(e.target.value));
    document.getElementById('btn-play').addEventListener('click', () => whiteboard.play());
    document.getElementById('btn-pause').addEventListener('click', () => whiteboard.pause());
    document.getElementById('btn-next').addEventListener('click', () => whiteboard.nextStep());
    document.getElementById('btn-prev').addEventListener('click', () => whiteboard.prevStep());
    document.getElementById('btn-reset').addEventListener('click', () => whiteboard.reset());

    // Initial load
    loadPreset('optics');
  </script>
</body>
</html>
